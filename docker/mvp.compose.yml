services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_DB: ${MVP_POSTGRES_DATABASE:?required}
      POSTGRES_PASSWORD: ${MVP_POSTGRES_PASSWORD:?required}
      POSTGRES_USER: ${MVP_POSTGRES_USER:?required}
    ports:
      - 127.0.0.1:${MVP_POSTGRES_PORT:?required}:5432
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - mvp-postgres:/var/lib/postgresql/data

volumes:
  mvp-postgres:
