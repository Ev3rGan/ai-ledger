name: Feature request
description: Propose a scoped improvement
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should this change solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful outcome, not only an implementation idea.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What should explicitly remain outside this request?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would make the request complete.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission check
      options:
        - label: I searched existing issues for related requests.
          required: true
