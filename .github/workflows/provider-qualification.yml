name: Live Provider qualification

on:
  workflow_call:
    inputs:
      pull_request_number:
        required: true
        type: number
      revision:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open same-repository PR number to qualify
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: live-provider-qualification-${{ inputs.revision || inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  qualification:
    name: qualify PR source against DeepSeek
    runs-on: windows-latest
    timeout-minutes: 15
    environment: provider-acceptance
    steps:
      - name: Check out main safely
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Select the exact open PR HEAD
        id: revision
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          $pullRequestNumber = $env:PULL_REQUEST_NUMBER
          if ($pullRequestNumber -notmatch '^[1-9][0-9]*$') {
            throw "Provider qualification requires one open pull request number"
          }
          $pullRequest = gh api `
            "repos/$env:GITHUB_REPOSITORY/pulls/$pullRequestNumber" |
            ConvertFrom-Json
          if ($pullRequest.state -ne "open") {
            throw "Provider qualification requires an open pull request"
          }
          if ($pullRequest.head.repo.full_name -ne $env:GITHUB_REPOSITORY) {
            throw "Provider qualification does not expose secrets to fork pull requests"
          }
          $revision = [string]$pullRequest.head.sha
          if (
            $env:REQUESTED_REVISION -and
            $env:REQUESTED_REVISION -ne $revision
          ) {
            throw "Requested PR revision is stale"
          }
          if ($revision -notmatch '^[0-9a-f]{40}$') {
            throw "Provider qualification requires an exact lowercase commit SHA"
          }
          git fetch origin "pull/$pullRequestNumber/head"
          $fetchedRevision = (git rev-parse FETCH_HEAD).Trim()
          if ($fetchedRevision -ne $revision) {
            throw "Fetched PR HEAD no longer matches GitHub metadata"
          }
          git checkout --detach $revision
          if ((git rev-parse HEAD).Trim() -ne $revision) {
            throw "Checked-out revision does not match the current PR HEAD"
          }
          "revision=$revision" >> $env:GITHUB_OUTPUT
          "pull_request_number=$pullRequestNumber" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install locked runtime
        run: uv sync --locked --python 3.12 --extra ch3

      - name: Run the one real Provider qualification gate
        shell: pwsh
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          uv run ai-intel-agent evaluate-research-provider `
            --revision "${{ steps.revision.outputs.revision }}" `
            --output "reports/research-provider-qualification.json"

      - name: Publish the safe qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-provider-qualification-pr-${{ steps.revision.outputs.pull_request_number }}-${{ steps.revision.outputs.revision }}
          path: reports/research-provider-qualification.json
          if-no-files-found: warn
          retention-days: 14
