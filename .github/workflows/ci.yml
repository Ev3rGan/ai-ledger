name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: quality
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --python 3.12 --extra ch3 --extra dev

      - name: Run deterministic tests (mocked providers only)
        run: uv run --extra dev pytest

      - name: Run lint
        run: uv run --extra dev ruff check .

      - name: Run sample CLI
        shell: pwsh
        run: |
          $script = @'
          import os
          import shutil
          import subprocess
          from uuid import uuid4

          from pg0 import Pg0

          server = Pg0(name=f"ai_ledger_ci_{uuid4().hex}")
          server.start()
          environment = dict(os.environ)
          environment["AI_INTEL_DATABASE_URL"] = server.uri
          executable = shutil.which("ai-intel-agent")
          if executable is None:
              raise RuntimeError("ai-intel-agent executable not found")
          try:
              subprocess.run([executable, "operator", "migrate"], env=environment, check=True)
              subprocess.run(
                  [executable, "run", "--sample", "--output", "reports/daily.md"],
                  env=environment,
                  check=True,
              )
          finally:
              server.drop()
          '@
          uv run --extra dev python -c $script

  provider-scope:
    name: detect Provider-facing changes
    runs-on: windows-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect the qualified source boundary
        id: scope
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ($env:EVENT_NAME -ne "pull_request") {
            "required=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $changed = @(git diff --name-only $env:BASE_SHA $env:HEAD_SHA -- `
            pyproject.toml `
            uv.lock `
            src/ai_intel_agent/cli.py `
            src/ai_intel_agent/domain.py `
            src/ai_intel_agent/model_routing_evaluation.py `
            src/ai_intel_agent/research.py `
            src/ai_intel_agent/research_provider_qualification.py `
            src/ai_intel_agent/data/model_routing_candidates.v1.json `
            src/ai_intel_agent/data/model_routing_evaluation.v1.json `
            src/ai_intel_agent/data/model_routing_protocol.v1.json `
            src/ai_intel_agent/data/research_protocol.v1.json `
            src/ai_intel_agent/data/research_provider_qualification.v1.json)
          if ($LASTEXITCODE -ne 0) {
            throw "Could not classify Provider-facing changes"
          }
          if ($changed.Count -eq 0) {
            "required=false" >> $env:GITHUB_OUTPUT
          } else {
            "required=true" >> $env:GITHUB_OUTPUT
          }

  provider-qualification:
    name: live Provider qualification
    needs:
      - quality
      - provider-scope
    if: >-
      github.event_name == 'pull_request' &&
      needs.quality.result == 'success' &&
      needs.provider-scope.outputs.required == 'true'
    uses: ./.github/workflows/provider-qualification.yml
    with:
      pull_request_number: ${{ github.event.pull_request.number }}
      revision: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read
      pull-requests: read

  provider-acceptance:
    name: provider-acceptance
    runs-on: windows-latest
    needs:
      - provider-scope
      - provider-qualification
    if: always()
    steps:
      - name: Require qualification only for Provider-facing changes
        shell: pwsh
        env:
          SCOPE_RESULT: ${{ needs.provider-scope.result }}
          QUALIFICATION_REQUIRED: ${{ needs.provider-scope.outputs.required }}
          QUALIFICATION_RESULT: ${{ needs.provider-qualification.result }}
        run: |
          if ($env:SCOPE_RESULT -ne "success") {
            throw "Provider change classification did not complete"
          }
          if (
            $env:QUALIFICATION_REQUIRED -eq "true" -and
            $env:QUALIFICATION_RESULT -ne "success"
          ) {
            throw "Provider-facing changes require the live Provider qualification"
          }
          if ($env:QUALIFICATION_REQUIRED -eq "true") {
            "Provider-facing changes passed the live Provider qualification."
          } else {
            "No Provider-facing changes; no real Provider call was required."
          }
