name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: quality
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: uv sync --locked --python 3.12 --extra ch3 --extra dev

      - name: Test and rebuild locked frontend assets
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test
          npm --prefix frontend run build
          git diff --exit-code -- src/ai_intel_agent/static src/ai_intel_agent/operator_static

      - name: Run deterministic tests (mocked providers only)
        run: uv run --extra dev pytest

      - name: Run lint
        run: uv run --extra dev ruff check .

      - name: Run sample CLI
        shell: pwsh
        run: |
          $script = @'
          import os
          import shutil
          import subprocess
          from uuid import uuid4

          from pg0 import Pg0

          server = Pg0(name=f"ai_ledger_ci_{uuid4().hex}")
          server.start()
          environment = dict(os.environ)
          environment["AI_INTEL_DATABASE_URL"] = server.uri
          executable = shutil.which("ai-intel-agent")
          if executable is None:
              raise RuntimeError("ai-intel-agent executable not found")
          try:
              subprocess.run([executable, "operator", "migrate"], env=environment, check=True)
              subprocess.run(
                  [executable, "run", "--sample", "--output", "reports/daily.md"],
                  env=environment,
                  check=True,
              )
          finally:
              server.drop()
          '@
          uv run --extra dev python -c $script

  release-candidate:
    name: release candidate image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build the production image from locked sources
        run: |
          docker build \
            --build-arg "AI_INTEL_RELEASE=${GITHUB_SHA}" \
            --file deploy/m1/production.Dockerfile \
            --tag ai-ledger-release-candidate:${GITHUB_SHA} .

      - name: Prove the runtime image has no Node toolchain
        run: |
          docker run --rm --entrypoint sh ai-ledger-release-candidate:${GITHUB_SHA} -eu -c '
            ! command -v node
            ! command -v npm
            ! command -v npx
            ! find /opt/ai-ledger -path "*/playwright/driver/node" -type f -print -quit | grep -q .
            test -z "$(find /opt/ai-ledger /usr/local /usr -type f \
              \( -name node -o -name nodejs -o -name npm -o -name npx \) \
              -perm /111 -print -quit)"
            test -f /opt/ai-ledger/src/ai_intel_agent/static/.vite/manifest.json
            test -f /opt/ai-ledger/src/ai_intel_agent/operator_static/.vite/manifest.json
            ai-intel-agent --help >/dev/null
          '

      - name: Validate the production Caddy boundary
        run: |
          docker run --rm --network none --read-only \
            --cap-drop ALL --cap-add NET_BIND_SERVICE \
            --tmpfs /config --tmpfs /data \
            --env AI_INTEL_DOMAIN=public.invalid \
            --env AI_INTEL_OPERATOR_DOMAIN=operator.invalid \
            --volume "${GITHUB_WORKSPACE}/deploy/m1/Caddyfile:/etc/caddy/Caddyfile:ro" \
            --entrypoint caddy \
            caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d \
            validate --config /etc/caddy/Caddyfile

      - name: Exercise Host, header, and cache isolation through Caddy
        shell: bash
        run: |
          set -euo pipefail
          image="ai-ledger-release-candidate:${GITHUB_SHA}"
          network="ai-ledger-rc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          backend="${network}-backend"
          edge="${network}-edge"
          cleanup() {
            status=$?
            if [[ ${status} -ne 0 ]]; then
              docker logs "${backend}" || true
              docker logs "${edge}" || true
            fi
            docker rm --force "${backend}" "${edge}" >/dev/null 2>&1 || true
            docker network rm "${network}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "${network}"
          docker run --detach --name "${backend}" \
            --network "${network}" --network-alias web \
            --entrypoint python \
            --volume "${GITHUB_WORKSPACE}/tests/fixtures/m7_caddy_backend.py:/tmp/backend.py:ro" \
            "${image}" /tmp/backend.py
          docker run --detach --name "${edge}" \
            --network "${network}" --network-alias edge \
            --read-only --cap-drop ALL --cap-add NET_BIND_SERVICE \
            --tmpfs /config --tmpfs /data \
            --env AI_INTEL_DOMAIN=http://public.invalid \
            --env AI_INTEL_OPERATOR_DOMAIN=http://operator.invalid \
            --volume "${GITHUB_WORKSPACE}/deploy/m1/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d \
            run --config /etc/caddy/Caddyfile
          docker run --rm --network "${network}" \
            --entrypoint python \
            --volume "${GITHUB_WORKSPACE}/tests/fixtures/m7_caddy_acceptance.py:/tmp/acceptance.py:ro" \
            "${image}" /tmp/acceptance.py

  provider-scope:
    name: detect Provider-facing changes
    runs-on: windows-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect the qualified source boundary
        id: scope
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ($env:EVENT_NAME -ne "pull_request") {
            "required=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $changed = @(git diff --name-only $env:BASE_SHA $env:HEAD_SHA -- `
            pyproject.toml `
            uv.lock `
            src/ai_intel_agent/accepted_knowledge.py `
            src/ai_intel_agent/cli.py `
            src/ai_intel_agent/domain.py `
            src/ai_intel_agent/model_routing_evaluation.py `
            src/ai_intel_agent/research.py `
            src/ai_intel_agent/research_provider_qualification.py `
            src/ai_intel_agent/web.py `
            src/ai_intel_agent/data/model_routing_candidates.v1.json `
            src/ai_intel_agent/data/model_routing_evaluation.v1.json `
            src/ai_intel_agent/data/model_routing_protocol.v1.json `
            src/ai_intel_agent/data/research_protocol.v1.json `
            src/ai_intel_agent/data/research_provider_qualification.v1.json)
          if ($LASTEXITCODE -ne 0) {
            throw "Could not classify Provider-facing changes"
          }
          if ($changed.Count -eq 0) {
            "required=false" >> $env:GITHUB_OUTPUT
          } else {
            "required=true" >> $env:GITHUB_OUTPUT
          }

  provider-qualification:
    name: live Provider qualification
    needs:
      - quality
      - release-candidate
      - provider-scope
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.quality.result == 'success' &&
      needs.release-candidate.result == 'success' &&
      needs.provider-scope.outputs.required == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    environment: provider-acceptance
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the exact PR HEAD
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the current same-repository PR HEAD
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          REQUESTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          $pullRequest = gh api `
            "repos/$env:GITHUB_REPOSITORY/pulls/$env:PULL_REQUEST_NUMBER" |
            ConvertFrom-Json
          if ($pullRequest.state -ne "open") {
            throw "Provider qualification requires an open pull request"
          }
          if ($pullRequest.head.repo.full_name -ne $env:GITHUB_REPOSITORY) {
            throw "Provider qualification does not expose secrets to fork pull requests"
          }
          if ([string]$pullRequest.head.sha -ne $env:REQUESTED_REVISION) {
            throw "Requested PR revision is stale"
          }
          if ((git rev-parse HEAD).Trim() -ne $env:REQUESTED_REVISION) {
            throw "Checked-out revision does not match the current PR HEAD"
          }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install locked runtime
        run: uv sync --locked --python 3.12 --extra ch3

      - name: Run the one real Provider qualification gate
        shell: pwsh
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          uv run ai-intel-agent evaluate-research-provider `
            --revision "${{ github.event.pull_request.head.sha }}" `
            --output "reports/research-provider-qualification.json"

      - name: Publish the safe qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-provider-qualification-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: reports/research-provider-qualification.json
          if-no-files-found: warn
          retention-days: 14

  provider-acceptance:
    name: provider-acceptance
    runs-on: windows-latest
    needs:
      - provider-scope
      - provider-qualification
    if: always()
    steps:
      - name: Require qualification only for Provider-facing changes
        shell: pwsh
        env:
          SCOPE_RESULT: ${{ needs.provider-scope.result }}
          QUALIFICATION_REQUIRED: ${{ needs.provider-scope.outputs.required }}
          QUALIFICATION_RESULT: ${{ needs.provider-qualification.result }}
        run: |
          if ($env:SCOPE_RESULT -ne "success") {
            throw "Provider change classification did not complete"
          }
          if (
            $env:QUALIFICATION_REQUIRED -eq "true" -and
            $env:QUALIFICATION_RESULT -ne "success"
          ) {
            throw "Provider-facing changes require the live Provider qualification"
          }
          if ($env:QUALIFICATION_REQUIRED -eq "true") {
            "Provider-facing changes passed the live Provider qualification."
          } else {
            "No Provider-facing changes; no real Provider call was required."
          }
