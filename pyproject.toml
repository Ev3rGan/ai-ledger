[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-intel-agent-template"
version = "0.1.0"
description = "A compact Python template for an AI intelligence Agent pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "AI Agent Developer" }]
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.116,<1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "sqlalchemy>=2.0",
    "httpx>=0.28.1",
    "uvicorn>=0.35,<1",
    "trafilatura>=2.2.0",
    "playwright>=1.62.0",
    "pgvector>=0.4,<1",
]

[project.optional-dependencies]
# Mirrors the ai-agent-book chapter-extra workflow:
#     uv sync --locked --python 3.12 --extra ch3
# This extra is intentionally light and focused on context, retrieval, and memory.
ch3 = [
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "rapidfuzz>=3.9",
]
retrieval = [
    "fastembed==0.8.0",
    "psutil>=7,<8",
]
dev = [
    "httpx2>=2,<3",
    "pg0-embedded==0.15.1",
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
ai-intel-agent = "ai_intel_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_intel_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "postgres: runs against PostgreSQL with pgvector",
]
